---
# =============================================================================
# MPLS Network Automation — Juniper SRX240
# Automates: interface IP assignment, OSPF (multi-area), MPLS + LDP config,
#            verification data collection, and end-to-end connectivity test.
# Requirements: Juniper.junos Ansible role, Python 3, NETCONF enabled on devices
# Usage: ansible-playbook project01.yaml -i inventory.yaml
# =============================================================================

- name: Configure OSPF on Juniper devices
  hosts: all
  roles:
    - Juniper.junos
  connection: local
  gather_facts: no
  tasks:

    - name: Configure interfaces with IP addresses
      juniper_junos_config:
        load: merge
        template: templates/interfaces.conf
        vars:
          interfaces: "{{ interfaces }}"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"

    - name: Configure OSPF and security zones on all routers
      juniper_junos_config:
        load: merge
        template: templates/ospf_template.conf
        vars:
          interfaces: "{{ interfaces }}"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"

    - name: Get route information and save to file
      juniper_junos_rpc:
        rpcs:
          - "get-route-information"
        formats: text
        dest: "{{ ansible_host }}-routing-information.txt"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"


- name: Configure MPLS on the core routers
  hosts: srx240_2,srx240_3,srx240_4,srx240_5
  roles:
    - Juniper.junos
  connection: local
  gather_facts: no
  tasks:

    - name: Configure LDP and MPLS on interfaces
      juniper_junos_config:
        load: merge
        template: templates/mpls_template.conf
        vars:
          interfaces: "{{ interfaces }}"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"

    - name: Save LDP neighbors for each router
      juniper_junos_rpc:
        rpcs:
          - "get-ldp-neighbor-information"
        formats: text
        dest: "{{ ansible_host }}-ldp-neighbors.txt"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"

    - name: Get inet.3 LDP routes
      juniper_junos_rpc:
        rpcs:
          - "get-route-information"
        args:
          table: "inet.3"
        formats: text
        dest: "{{ ansible_host }}-inet3-routes.txt"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"

    - name: Get MPLS forwarding table
      juniper_junos_rpc:
        rpcs:
          - "get-route-information"
        args:
          table: "mpls.0"
        formats: text
        dest: "{{ ansible_host }}-mpls-routes.txt"
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"


- name: Test connectivity between two edge IP networks
  hosts: srx240_1
  roles:
    - Juniper.junos
  connection: local
  gather_facts: no
  tasks:

    - name: Ping Area 2 edge (R6) from Area 1 edge (R1) — validates MPLS backbone
      juniper_junos_rpc:
        rpcs:
          - ping
        kwargs:
          host: 9.1.1.2
        provider:
          host: "{{ ansible_host }}"
          user: "{{ lookup('env', 'JUNOS_USER') | default('labuser') }}"
          password: "{{ lookup('env', 'JUNOS_PASSWORD') }}"
      register: result

    - name: Print ping result
      debug:
        var: result
